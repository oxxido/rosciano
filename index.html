<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espacio Rosciano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
      overflow: hidden;
    }

    #neuro {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.95;
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 672px;
      padding: 56px 32px;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.10);
      border-radius: 8px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: slideInUp 0.8s both;
    }

    h1 {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: 34px;
      line-height: 1.05;
      margin-bottom: 40px;
    }

    @media (min-width: 768px) {
      h1 { font-size: 44px; }
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    button {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #fff;
      background: transparent;
      padding: 16px 32px;
      border: 2px solid rgba(255, 255, 255, 0.10);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    button:hover,
    button:focus-visible {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.35);
      outline: none;
    }

    #msg {
      height: 1.5em;
      margin-top: 28px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.6);
      opacity: 0;
      transition: opacity 0.3s;
    }

    #msg.show { opacity: 1; }

    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="neuro"></canvas>

  <main>
    <section class="card">
      <h1>Bienvenido al espacio Rosciano</h1>
      <div class="actions">
        <button type="button" data-name="Gerardo" data-url="https://gerardo.rosciano.com.ar">Ir a Gerardo</button>
        <button type="button" data-name="Valentin">Ir a Valentin</button>
      </div>
      <p id="msg" aria-live="polite"></p>
    </section>
  </main>

  <script>
    // Interactive Neural Vortex Background — shader by Le Thanh (21st.dev/@minhxthanh)
    (function () {
      const canvas = document.getElementById('neuro');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) { console.error('WebGL not supported'); return; }

      const vertexSrc = `
        precision mediump float;
        attribute vec2 a_position;
        varying vec2 vUv;
        void main() {
          vUv = .5 * (a_position + 1.);
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fragmentSrc = `
        precision mediump float;
        varying vec2 vUv;
        uniform float u_time;
        uniform float u_ratio;
        uniform vec2 u_pointer_position;
        uniform float u_scroll_progress;

        vec2 rotate(vec2 uv, float th) {
          return mat2(cos(th), sin(th), -sin(th), cos(th)) * uv;
        }

        float neuro_shape(vec2 uv, float t, float p) {
          vec2 sine_acc = vec2(0.);
          vec2 res = vec2(0.);
          float scale = 8.;
          for (int j = 0; j < 15; j++) {
            uv = rotate(uv, 1.);
            sine_acc = rotate(sine_acc, 1.);
            vec2 layer = uv * scale + float(j) + sine_acc - t;
            sine_acc += sin(layer) + 2.4 * p;
            res += (.5 + .5 * cos(layer)) / scale;
            scale *= (1.2);
          }
          return res.x + res.y;
        }

        void main() {
          vec2 uv = .5 * vUv;
          uv.x *= u_ratio;
          vec2 pointer = vUv - u_pointer_position;
          pointer.x *= u_ratio;
          float p = clamp(length(pointer), 0., 1.);
          p = .5 * pow(1. - p, 2.);
          float t = .001 * u_time;
          vec3 color = vec3(0.);
          float noise = neuro_shape(uv, t, p);
          noise = 1.2 * pow(noise, 3.);
          noise += pow(noise, 10.);
          noise = max(.0, noise - .5);
          noise *= (1. - length(vUv - .5));
          color = vec3(0.5, 0.15, 0.65);
          color = mix(color, vec3(0.02, 0.7, 0.9), 0.32 + 0.16 * sin(2.0 * u_scroll_progress + 1.2));
          color += vec3(0.15, 0.0, 0.6) * sin(2.0 * u_scroll_progress + 1.5);
          color = color * noise;
          gl_FragColor = vec4(color, noise);
        }
      `;

      function compile(type, src) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, src);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error('Shader error:', gl.getShaderInfoLog(shader));
          return null;
        }
        return shader;
      }

      const program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSrc));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSrc));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error('Program link error:', gl.getProgramInfoLog(program));
        return;
      }
      gl.useProgram(program);

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const position = gl.getAttribLocation(program, 'a_position');
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

      const uTime = gl.getUniformLocation(program, 'u_time');
      const uRatio = gl.getUniformLocation(program, 'u_ratio');
      const uPointer = gl.getUniformLocation(program, 'u_pointer_position');
      const uScroll = gl.getUniformLocation(program, 'u_scroll_progress');

      const pointer = { x: 0, y: 0, tX: 0, tY: 0 };

      function resize() {
        const dpr = Math.min(window.devicePixelRatio, 2);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform1f(uRatio, canvas.width / canvas.height);
      }
      resize();
      window.addEventListener('resize', resize);

      window.addEventListener('pointermove', (e) => {
        pointer.tX = e.clientX;
        pointer.tY = e.clientY;
      });

      function render() {
        pointer.x += (pointer.tX - pointer.x) * 0.2;
        pointer.y += (pointer.tY - pointer.y) * 0.2;
        gl.uniform1f(uTime, performance.now());
        gl.uniform2f(uPointer, pointer.x / window.innerWidth, 1 - pointer.y / window.innerHeight);
        gl.uniform1f(uScroll, 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      render();
    })();

    // Botones
    (function () {
      const msg = document.getElementById('msg');
      let timer;
      document.querySelectorAll('button[data-name]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (btn.dataset.url) {
            window.location.href = btn.dataset.url;
            return;
          }
          msg.textContent = 'Próximamente';
          msg.classList.add('show');
          clearTimeout(timer);
          timer = setTimeout(() => msg.classList.remove('show'), 2500);
        });
      });
    })();
  </script>
</body>
</html>
